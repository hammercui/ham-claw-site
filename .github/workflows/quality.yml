name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  release-contract-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned minisign-compatible verifier
        run: cargo install rsign2 --locked --version 0.6.6
      - name: Test release intake and publisher contracts
        shell: powershell
        run: .\scripts\Test-ReleasePublisher.ps1
